name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the three packages the offline recompute needs, at the versions in requirements.txt.
      # The fetch and build packages are left out: those scripts need the network.
      - name: Install the offline recompute packages
        run: python3 -m pip install numpy==2.5.5 pandas==3.1.1 scipy==1.18.1
      - name: Rerun every README number from the shipped data
        run: python3 -I scripts/reproduce.py
